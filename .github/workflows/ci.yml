name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e '.[dev]' ruff==0.17.6
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Dashboards are generated from scripts/gen_dashboards.py
        run: python scripts/gen_dashboards.py && git diff --exit-code deploy/grafana/dashboards

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
      REQUIRE_REDIS: "1" # Redis-backed tests must run, not skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}", cache: pip }
      - run: pip install -e '.[dev]'
      - run: pytest -q -rfE --cov=app --cov-report=term-missing --cov-fail-under=85

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config + rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.1.0 check config /etc/prometheus/prometheus.yml
      - name: amtool check-config
        run: |
          sed "s|__SLACK_WEBHOOK_URL__|https://hooks.slack.com/services/T000/B000/XXX|" \
            deploy/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
          docker run --rm -v /tmp/alertmanager.yml:/tmp/am.yml:ro --entrypoint amtool \
            prom/alertmanager:v0.28.0 check-config /tmp/am.yml

  compose-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Runner hardware (context for the load-test numbers)
        run: |
          echo "vCPUs=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')GiB"
          lscpu | grep -i "model name"
      - name: Start stack
        run: docker compose up -d --build --wait gateway redis mock-primary mock-secondary jaeger
      - name: Smoke test
        run: |
          set -euo pipefail
          ADMIN=demo-admin-key-change-me-0000
          curl -fsS localhost:8000/healthz
          curl -fsS localhost:8000/readyz
          chat() { curl -fsS -X POST localhost:8000/v1/chat/completions -H 'Content-Type: application/json' \
                     -H 'X-API-Key: demo-live-key' -d '{"model":"balanced","messages":[{"role":"user","content":"hi"}]}'; }
          chat | python -c "import json,sys; m=json.load(sys.stdin)['x_gateway']; assert m['provider']=='mock-primary', m; print(m)"
          curl -fsS -X POST 'localhost:8000/v1/admin/providers/mock-primary/simulate-outage?enabled=true' -H "X-Admin-Key: $ADMIN"
          chat | python -c "import json,sys; m=json.load(sys.stdin)['x_gateway']; assert m['fallback_used'], m; print(m)"
          # Real HTTP fault from the mock provider service (not gateway-side injection)
          curl -fsS -X POST 'localhost:8000/v1/admin/providers/mock-primary/simulate-outage?enabled=false' -H "X-Admin-Key: $ADMIN"
          curl -fsS -X POST localhost:9002/fault -H 'Content-Type: application/json' -d '{"error_rate":1.0,"status":503}'
          curl -fsS -X POST localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -H 'X-API-Key: demo-live-key' \
            -d '{"model":"economy","messages":[{"role":"user","content":"hi"}]}' \
            | python -c "import json,sys; m=json.load(sys.stdin)['x_gateway']; assert m['provider']=='mock-primary', m; print(m)"
          curl -fsS -X POST localhost:9002/fault -H 'Content-Type: application/json' -d '{"error_rate":0}'
          curl -fsS -N -X POST localhost:8000/v1/chat/completions -H 'Content-Type: application/json' -H 'X-API-Key: demo-live-key' \
            -d '{"model":"balanced","stream":true,"messages":[{"role":"user","content":"stream"}]}' | tail -n 3
          curl -fsS localhost:8000/metrics | grep -E '^gateway_(fallbacks|circuit_state)' || true
      - name: Load test - capacity (closed loop, 500 concurrent)
        run: |
          pip install aiohttp
          python loadtests/loadtest.py --requests 5000 --concurrency 500
      # Shared 2-vCPU runners are noisy (overhead p95 3.9-12.1 ms on identical code), so this is a
      # regression guard, not proof of the 10 ms SLO. The SLO itself needs dedicated hardware.
      - name: Load test - overhead regression guard (open loop, 100 req/s, fails if p95 > 25 ms)
        run: python loadtests/loadtest.py --requests 3000 --rate 100 --max-overhead-p95-ms 25
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop stack
        if: always()
        run: docker compose down -v
