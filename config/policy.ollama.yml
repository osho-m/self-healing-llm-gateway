# Real-model policy: a local Ollama model as the primary, with a deterministic mock as fallback.
#   ollama pull qwen2.5:0.5b
#   GATEWAY_POLICY_PATH=config/policy.ollama.yml uvicorn app.main:app_factory --factory
# Stop Ollama mid-run to watch real connection errors trip the circuit and fail over.
providers:
  - name: ollama-local
    kind: ollama
    model: qwen2.5:0.5b
    base_url: http://127.0.0.1:11434/v1
    timeout_s: 60
  - name: mock-fallback
    kind: mock
    model: mock-small

tiers:
  balanced: [ollama-local, mock-fallback]

teams:
  - team_id: demo
    name: Demo team
    api_keys: [demo-live-key]
    allowed_tiers: [balanced]
    requests_per_minute: 120
    tokens_per_minute: 200000
    daily_budget_usd: 5.0

resilience:
  max_retries: 1
  backoff_base_s: 0.1
  backoff_max_s: 0.5
  circuit_failure_threshold: 2
  circuit_window_s: 30
  circuit_cooldown_s: 10
