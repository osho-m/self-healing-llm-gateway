# Policy for the public Hugging Face Space (demo.py).
#
# Three open-source models run inside the Space on ZeroGPU. No paid API is used.
#
#   smollm2   HuggingFaceTB/SmolLM2-1.7B-Instruct  (Apache-2.0)  small and fast
#   qwen      Qwen/Qwen2.5-1.5B-Instruct           (Apache-2.0)  good all-rounder
#   phi       microsoft/Phi-3.5-mini-instruct      (MIT)         largest, best answers
#   mock      deterministic last resort, so the demo still answers if every model is down
#
# Each tier starts with one model and falls back to the other two, then the mock.
# demo.py registers the models; without a GPU runtime they are skipped.
# Self-hosted models have no per-token price, so cost shows as $0; rate limits still apply.
providers:
  - name: smollm2
    kind: local
    model: HuggingFaceTB/SmolLM2-1.7B-Instruct
    timeout_s: 60
  - name: qwen
    kind: local
    model: Qwen/Qwen2.5-1.5B-Instruct
    timeout_s: 60
  - name: phi
    kind: local
    model: microsoft/Phi-3.5-mini-instruct
    timeout_s: 60
  - name: mock
    kind: mock
    model: mock-small

tiers:
  economy: [smollm2, qwen, phi, mock]
  balanced: [qwen, phi, smollm2, mock]
  premium: [phi, qwen, smollm2, mock]

teams:
  - team_id: demo
    name: Public demo
    api_keys: [demo-live-key]
    allowed_tiers: [economy, balanced, premium]
    requests_per_minute: 30
    tokens_per_minute: 60000
    daily_budget_usd: 1.0
    enrichment:
      system_prompt: "You are a concise assistant. Answer in at most three sentences."

resilience:
  max_retries: 1
  backoff_base_s: 0.2
  backoff_max_s: 1.0
  circuit_failure_threshold: 2
  circuit_window_s: 60
  circuit_cooldown_s: 20
  health_check_interval_s: 300
