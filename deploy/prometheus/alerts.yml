groups:
  - name: llm-gateway
    rules:
      - alert: ProviderErrorRateHigh
        expr: |
          sum by (provider) (rate(gateway_errors_total[5m]))
            / clamp_min(sum by (provider) (rate(gateway_provider_duration_seconds_count[5m])), 1e-9) > 0.05
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Provider {{ $labels.provider }} error rate {{ $value | humanizePercentage }}"
          description: >-
            More than 5% of calls to {{ $labels.provider }} failed over 5m. Retries and tier fallback are active;
            check GET /v1/admin/providers for circuit state and the Operations dashboard for affected tiers.

      - alert: CircuitBreakerOpen
        expr: max by (provider) (gateway_circuit_state) == 2
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Circuit OPEN for {{ $labels.provider }}"
          description: >-
            All traffic to {{ $labels.provider }} is routed to fallbacks. The gateway probes it again after the
            cooldown. If no fallback is healthy, affected tiers return 503.

      - alert: AllProvidersFailingForTier
        expr: sum by (tier) (rate(gateway_requests_total{status="503"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Tier {{ $labels.tier }} has no healthy provider"
          description: "Requests to tier {{ $labels.tier }} fail with 503 after exhausting the fallback chain."

      - alert: TeamApproachingBudget
        expr: max by (team) (gateway_budget_utilization_ratio) >= 0.8 < 1
        labels:
          severity: warning
        annotations:
          summary: "Team {{ $labels.team }} has used {{ $value | humanizePercentage }} of its daily budget"
          description: "Requests are blocked with budget_exceeded at 100%. Raise via PATCH /v1/admin/teams/{{ $labels.team }}."

      - alert: TeamBudgetExhausted
        expr: max by (team) (gateway_budget_utilization_ratio) >= 1
        labels:
          severity: critical
        annotations:
          summary: "Team {{ $labels.team }} hit its daily budget cap"
          description: "All requests from {{ $labels.team }} are blocked until 00:00 UTC or an admin raises the cap."

      - alert: LatencyP99AboveSLA
        expr: |
          histogram_quantile(0.99, sum by (le, provider) (rate(gateway_request_duration_seconds_bucket[5m]))) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P99 latency via {{ $labels.provider }} is {{ $value | humanizeDuration }} (SLA 5s)"
          description: "Users of tiers served by {{ $labels.provider }} see slow responses. Consider reordering the tier chain."

      - alert: GatewayOverheadHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(gateway_overhead_seconds_bucket[5m]))) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Gateway P99 overhead {{ $value | humanizeDuration }} exceeds the 10ms target"
          description: "Check Redis latency and gateway CPU saturation; scale gateway replicas horizontally."
